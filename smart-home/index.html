<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Умная квартира 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="side side-left">
      <header class="brand">
        <div>
          <h1>Умная квартира</h1>
          <p>Визуализация автоматизации</p>
        </div>
        <span id="mode" class="mode-chip">Дома</span>
      </header>

      <section>
        <h2>Сценарии</h2>
        <div id="scenes" class="scenes"></div>
      </section>

      <section>
        <h2>Помещения</h2>
        <div id="rooms" class="rooms"></div>
      </section>

      <section>
        <h2>Правила автоматизации</h2>
        <div id="rules" class="rules"></div>
      </section>
    </aside>

    <main class="stage">
      <div id="viewport" class="viewport"></div>
      <div class="toolbar">
        <div class="group">
          <button id="view-iso" class="tb">Изометрия</button>
          <button id="view-top" class="tb">Сверху</button>
          <button id="view-front" class="tb">Сбоку</button>
        </div>
        <div class="group">
          <button id="walls" class="tb">Срез стен</button>
          <button id="markers" class="tb active">Устройства</button>
          <button id="panel-open" class="tb">Щиток</button>
          <button id="inv-open" class="tb">Паспорт</button>
        </div>
        <div class="group time">
          <button id="time-play" class="tb" title="Ускоренное время">▶</button>
          <input id="time" type="range" min="0" max="23.99" step="0.05" aria-label="Время суток">
          <span id="time-label">19:30</span>
        </div>
      </div>
      <section id="panel-drawer" class="panel-drawer" hidden aria-label="Электрощиток">
        <header class="pdr-head">
          <div>
            <h2>Электрощиток</h2>
            <p id="panel-summary" class="pdr-summary"></p>
          </div>
          <div class="pdr-legend">
            <span><i class="lg lg-main"></i>Ввод</span>
            <span><i class="lg lg-rcbo"></i>Дифавтомат 30 мА</span>
            <span><i class="lg lg-mcb"></i>Автомат</span>
          </div>
          <button id="panel-close" class="tb" type="button" aria-label="Закрыть щиток">✕</button>
        </header>
        <div class="pdr-body">
          <div class="panel-scroll"><div id="panel-rows" class="panel-rows"></div></div>
          <div id="panel-detail" class="panel-detail"></div>
        </div>
      </section>
      <section id="inv-drawer" class="panel-drawer inv-drawer" hidden aria-label="Паспорт квартиры">
        <header class="pdr-head">
          <div>
            <h2>Паспорт квартиры</h2>
            <p id="inv-summary" class="pdr-summary">Загрузка…</p>
          </div>
          <div class="inv-tools">
            <div id="inv-tabs" class="segmented" role="tablist" aria-label="Раздел паспорта">
              <button type="button" data-tab="items" class="active">Позиции</button>
              <button type="button" data-tab="docs">Документы</button>
            </div>
            <input id="inv-search" type="search" placeholder="Поиск: название, бренд, артикул, документ" aria-label="Поиск">
            <select id="inv-room" aria-label="Помещение"></select>
            <select id="inv-cat" aria-label="Категория"></select>
            <label class="inv-check"><input id="inv-missing" type="checkbox"> Только незаполненные</label>
            <button id="inv-add" class="chip" type="button">Добавить</button>
            <label class="chip inv-import" hidden>Загрузить документ<input id="inv-upload" type="file" accept="application/pdf,image/*,.txt,.csv,.md"></label>
            <button id="inv-export" class="chip" type="button" hidden>Выгрузить JSON</button>
            <label class="chip inv-import" hidden>Загрузить JSON<input id="inv-import" type="file" accept="application/json,.json"></label>
          </div>
          <button id="inv-close" class="tb" type="button" aria-label="Закрыть паспорт">✕</button>
        </header>
        <div class="pdr-body inv-body">
          <div id="inv-list" class="inv-list"></div>
          <div id="inv-form" class="inv-form"></div>
        </div>
      </section>
      <div class="bottom">
        <div class="sims-wrap">
          <h2>Имитация событий</h2>
          <div id="sims" class="sims"></div>
        </div>
        <div class="log-wrap">
          <h2>Журнал</h2>
          <div id="log" class="log"></div>
        </div>
      </div>
    </main>

    <aside class="side side-right">
      <header class="panel-head">
        <h2 id="panel-title">Гостиная</h2>
        <div id="panel-climate" class="climate"></div>
        <button id="room-inventory" class="chip room-inv-btn" type="button">Паспорт комнаты</button>
      </header>
      <div id="devices" class="devices"></div>
    </aside>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
